name: Check job postings

on:
  schedule:
    # Every 2 hours
    - cron: "7 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: job-bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_jobs.py

      - name: Commit updated state
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"
          mkdir -p /tmp/state && cp seen_jobs.json run_state.json /tmp/state/
          git add seen_jobs.json run_state.json
          git diff --quiet --cached || git commit -m "Update seen jobs"
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash && git push && exit 0
            echo "push attempt $i failed, retrying in 5s"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "rebase kept failing, saving state on top of origin/main"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/state/seen_jobs.json /tmp/state/run_state.json .
          git add seen_jobs.json run_state.json
          git diff --quiet --cached || git commit -m "Update seen jobs"
          git push
